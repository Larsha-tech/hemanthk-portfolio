<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1a3358"/>
      <stop offset="100%" stop-color="#0f1f38"/>
    </linearGradient>
    <linearGradient id="letter" x1="20" y1="14" x2="44" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#93c5fd"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Rounded square background -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- Subtle top sheen -->
  <rect width="64" height="30" rx="14" fill="white" fill-opacity="0.04"/>

  <!-- Accent dot -->
  <circle cx="49" cy="15" r="3.5" fill="#3b82f6" fill-opacity="0.8"/>

  <!-- Letter H with glow -->
  <g filter="url(#glow)">
    <rect x="17" y="14" width="6" height="36" rx="2" fill="url(#letter)"/>
    <rect x="41" y="14" width="6" height="36" rx="2" fill="url(#letter)"/>
    <rect x="17" y="29" width="30" height="6" rx="2" fill="url(#letter)"/>
  </g>
</svg>
